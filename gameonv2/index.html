<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTacToe</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&display=swap" rel="stylesheet">
</head>
<body>
    <main class="page">
        <p class="course">Des 157a</p>
        <h1>Tik Tac Toe</h1>

        <div id="scoreboard">
            <div class="score-box">
                <p class="player-x">X</p>
                <p id="x-score">0</p>
            </div>

            <div class="score-box">
                <p class="draw">Draw</p>
                <p id="draw-score">0</p>
            </div>

            <div class="score-box">
                <p class="player-o">O</p>
                <p id="o-score">0</p>
            </div>
        </div>

        <div id="message"></div>

        <div id="game-board">
            <div class="cell right bottom" data-index="0"></div>
            <div class="cell right bottom" data-index="1"></div>
            <div class="cell bottom" data-index="2"></div>

            <div class="cell right bottom" data-index="3"></div>
            <div class="cell right bottom" data-index="4"></div>
            <div class="cell bottom" data-index="5"></div>

            <div class="cell right" data-index="6"></div>
            <div class="cell right" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <button id="reset">Reset Game</button>

        <footer>
            Coded by Enoch De Leon 2026 Winter
        </footer>
    </main>
</body>
</html>
